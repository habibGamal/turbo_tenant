name: Engineering atlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test atlas tooling
        run: python .agents/skills/engineering-atlas/scripts/test_atlas.py
      - name: Validate source freshness and generated artifacts
        run: python .agents/skills/engineering-atlas/scripts/atlas.py check .
